name: Trusted P1 large real-store campaign

on:
  workflow_dispatch:
    inputs:
      backend:
        description: Storage backend to campaign
        required: true
        default: sqlite
        type: choice
        options:
          - sqlite
          - postgres
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: trusted-p1-campaign-${{ github.event_name == 'schedule' && 'nightly' || inputs.backend }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sqlite:
    if: github.event_name == 'schedule' || inputs.backend == 'sqlite'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_RUN_LIVE_TESTS: "0"
      VV_AGENT_CONTRACT_SOURCE: ${{ github.workspace }}/contract
    steps:
      - name: Checkout contract
        uses: actions/checkout@v6
        with:
          path: contract
          ref: v39.0.0
          fetch-depth: 0

      - name: Checkout Python implementation
        uses: actions/checkout@v6
        with:
          repository: AndersonBY/vv-agent
          path: vv-agent
          ref: 54a437d1298ddcf400d7ec83f72bf508385ff9aa

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: vv-agent/uv.lock

      - name: Install dependencies
        working-directory: vv-agent
        run: uv sync --locked --dev --extra s3

      - name: Verify exact Contract 39 source
        working-directory: vv-agent
        run: python3 scripts/contract_snapshot.py check --source "$VV_AGENT_CONTRACT_SOURCE"

      - name: Run SQLite shard
        working-directory: vv-agent
        env:
          TMPDIR: /tmp
          SHARD: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          total=1000000
          shards=8
          seed=$((SHARD * total / shards))
          count=$((total / shards))
          report="$RUNNER_TEMP/p1-sqlite-${SHARD}.json"
          timeout 270m uv run python scripts/session_simulation.py \
            --backend sqlite --seed "$seed" --seeds "$count" --workers 4 --report "$report"
          python3 - "$report" "$seed" "$count" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1]))
          expected_seed = int(sys.argv[2])
          expected_count = int(sys.argv[3])
          checks = {
              "code_digest": "25db2aaeaa62d1b25ded9ce9371a96306b21869f3b7240f9eb9f8e582be12cc5",
              "code_revision": "54a437d1298ddcf400d7ec83f72bf508385ff9aa",
              "contract_revision": "ec154627d2153812d4b81e6863e5bdda0df64c5f",
              "contract_version": "39.0.0",
              "contract_manifest_sha256": "9daf29d5573069566b3ef28f6570950140f7a8a1bb7d0e70f1afa5092b2f703a",
              "backend": "sqlite",
              "seed": expected_seed,
              "seeds": expected_count,
          }
          for key, expected in checks.items():
              if report.get(key) != expected:
                  raise SystemExit(f"{key}: expected {expected!r}, got {report.get(key)!r}")
          if report.get("contract_selection") != "local" or report.get("contract_dirty") is not False:
              raise SystemExit(f"unexpected contract source identity: {report.get('contract_selection')!r} / {report.get('contract_dirty')!r}")
          if report.get("dirty") is not False or report.get("in_memory_mutations") != []:
              raise SystemExit(f"unexpected source or mutation identity: {report.get('dirty')!r} / {report.get('in_memory_mutations')!r}")
          inventory = ["accepted", "accepted_lost", "approval_reply", "cancel", "cancel_descendants", "children", "context_compacted", "definition_mismatch", "factory_not_ready", "future_input", "late_result", "lease_takeover", "metered_tool", "model_result_precommit", "model_unknown", "postcommit", "precommit", "reply_loss", "tools", "unknown_idempotent", "unknown_unsafe"]
          if report.get("scenario_inventory") != inventory or report.get("scenario_inventory_sha256") != "fd91a468e23c2557eeee0f5acaefab5cc0c1bdcf81c4ddd7c5f0d7badf128da4":
              raise SystemExit("scenario inventory identity mismatch")
          scenarios = report.get("scenarios", {})
          if set(scenarios) != set(inventory) or sum(scenarios.values()) != expected_count or any(scenarios[name] < 1 for name in inventory):
              raise SystemExit(f"incomplete scenario coverage: {scenarios!r}")
          if report.get("covered") != ["I1", "I10", "I2", "I3", "I4", "I5", "I6", "I7", "I8"]:
              raise SystemExit(f"unexpected invariant coverage: {report.get('covered')!r}")
          storage = report.get("environment", {}).get("sqlite_temporary_storage", {})
          if storage.get("verified") is not True or any(observation.get("filesystem") == "tmpfs" for observation in storage.get("observations", [])):
              raise SystemExit(f"SQLite storage was not ordinary filesystem: {storage!r}")
          PY

      - name: Upload SQLite shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-p1-sqlite-${{ matrix.shard }}
          path: ${{ runner.temp }}/p1-sqlite-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  postgres:
    if: github.event_name == 'schedule' || inputs.backend == 'postgres'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vv_agent
          POSTGRES_PASSWORD: vv_agent_test
          POSTGRES_DB: vv_agent_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U vv_agent -d vv_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_RUN_LIVE_TESTS: "0"
      VV_AGENT_CONTRACT_SOURCE: ${{ github.workspace }}/contract
    steps:
      - name: Checkout contract
        uses: actions/checkout@v6
        with:
          path: contract
          ref: v39.0.0
          fetch-depth: 0

      - name: Checkout Python implementation
        uses: actions/checkout@v6
        with:
          repository: AndersonBY/vv-agent
          path: vv-agent
          ref: 54a437d1298ddcf400d7ec83f72bf508385ff9aa

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: vv-agent/uv.lock

      - name: Install dependencies
        working-directory: vv-agent
        run: uv sync --locked --dev --extra s3

      - name: Verify exact Contract 39 source
        working-directory: vv-agent
        run: python3 scripts/contract_snapshot.py check --source "$VV_AGENT_CONTRACT_SOURCE"

      - name: Run PostgreSQL shard
        working-directory: vv-agent
        env:
          SHARD: ${{ matrix.shard }}
          VV_AGENT_TEST_POSTGRES_DSN: postgresql://vv_agent:vv_agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/vv_agent_test
        shell: bash
        run: |
          set -euo pipefail
          total=10000
          shards=8
          seed=$((SHARD * total / shards))
          count=$((total / shards))
          report="$RUNNER_TEMP/p1-postgres-${SHARD}.json"
          timeout 270m uv run python scripts/session_simulation.py \
            --backend postgres --seed "$seed" --seeds "$count" --workers 4 --report "$report"
          python3 - "$report" "$seed" "$count" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1]))
          expected_seed = int(sys.argv[2])
          expected_count = int(sys.argv[3])
          checks = {
              "code_digest": "25db2aaeaa62d1b25ded9ce9371a96306b21869f3b7240f9eb9f8e582be12cc5",
              "code_revision": "54a437d1298ddcf400d7ec83f72bf508385ff9aa",
              "contract_revision": "ec154627d2153812d4b81e6863e5bdda0df64c5f",
              "contract_version": "39.0.0",
              "contract_manifest_sha256": "9daf29d5573069566b3ef28f6570950140f7a8a1bb7d0e70f1afa5092b2f703a",
              "backend": "postgres",
              "seed": expected_seed,
              "seeds": expected_count,
          }
          for key, expected in checks.items():
              if report.get(key) != expected:
                  raise SystemExit(f"{key}: expected {expected!r}, got {report.get(key)!r}")
          if report.get("contract_selection") != "local" or report.get("contract_dirty") is not False:
              raise SystemExit(f"unexpected contract source identity: {report.get('contract_selection')!r} / {report.get('contract_dirty')!r}")
          if report.get("dirty") is not False or report.get("in_memory_mutations") != []:
              raise SystemExit(f"unexpected source or mutation identity: {report.get('dirty')!r} / {report.get('in_memory_mutations')!r}")
          inventory = ["accepted", "accepted_lost", "approval_reply", "cancel", "cancel_descendants", "children", "context_compacted", "definition_mismatch", "factory_not_ready", "future_input", "late_result", "lease_takeover", "metered_tool", "model_result_precommit", "model_unknown", "postcommit", "precommit", "reply_loss", "tools", "unknown_idempotent", "unknown_unsafe"]
          if report.get("scenario_inventory") != inventory or report.get("scenario_inventory_sha256") != "fd91a468e23c2557eeee0f5acaefab5cc0c1bdcf81c4ddd7c5f0d7badf128da4":
              raise SystemExit("scenario inventory identity mismatch")
          scenarios = report.get("scenarios", {})
          if set(scenarios) != set(inventory) or sum(scenarios.values()) != expected_count or any(scenarios[name] < 1 for name in inventory):
              raise SystemExit(f"incomplete scenario coverage: {scenarios!r}")
          if report.get("covered") != ["I1", "I10", "I2", "I3", "I4", "I5", "I6", "I7", "I8"]:
              raise SystemExit(f"unexpected invariant coverage: {report.get('covered')!r}")
          cleanup = report.get("environment", {}).get("postgres_cleanup")
          if not cleanup or cleanup.get("verified") is not True:
              raise SystemExit(f"PostgreSQL cleanup was not verified: {cleanup!r}")
          PY

      - name: Upload PostgreSQL shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trusted-p1-postgres-${{ matrix.shard }}
          path: ${{ runner.temp }}/p1-postgres-${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 14

  aggregate:
    if: >-
      always() &&
      ((github.event_name == 'schedule' && needs.sqlite.result == 'success' && needs.postgres.result == 'success') ||
      (inputs.backend == 'sqlite' && needs.sqlite.result == 'success') ||
      (inputs.backend == 'postgres' && needs.postgres.result == 'success'))
    needs: [sqlite, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Download campaign evidence
        uses: actions/download-artifact@v5
        with:
          pattern: trusted-p1-*
          path: reports
          merge-multiple: true

      - name: Verify contiguous campaign manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = {"sqlite": 1_000_000, "postgres": 10_000}
          required = set(expected) if "${{ github.event_name }}" == "schedule" else {"${{ inputs.backend }}"}
          found = {backend: [] for backend in expected}
          for path in sorted(Path("reports").glob("p1-*.json")):
              report = json.loads(path.read_text())
              backend = report.get("backend")
              if backend in found:
                  found[backend].append((report["seed"], report["seeds"], report, path))
          manifest = {"code_digest": None, "code_revision": None, "contract_revision": None, "contract_version": None, "contract_manifest_sha256": None, "scenario_inventory_sha256": None, "backends": {}}
          for backend in required:
              total = expected[backend]
              parts = sorted(found[backend], key=lambda item: item[0])
              if not parts:
                  raise SystemExit(f"missing backend evidence: {backend}")
              cursor = 0
              seen = set()
              for seed, count, report, path in parts:
                  if seed in seen:
                      raise SystemExit(f"{backend}: duplicate seed {seed}")
                  seen.add(seed)
                  if seed != cursor:
                      raise SystemExit(f"{backend}: expected seed {cursor}, got {seed}")
                  cursor += count
                  identity = tuple(report[key] for key in ("code_digest", "code_revision", "contract_revision", "contract_version", "contract_manifest_sha256", "scenario_inventory_sha256"))
                  if manifest["code_revision"] is None:
                      manifest["code_digest"], manifest["code_revision"], manifest["contract_revision"], manifest["contract_version"], manifest["contract_manifest_sha256"], manifest["scenario_inventory_sha256"] = identity
                  elif identity != tuple(manifest[key] for key in ("code_digest", "code_revision", "contract_revision", "contract_version", "contract_manifest_sha256", "scenario_inventory_sha256")):
                      raise SystemExit(f"{backend}: identity mismatch in {seed}")
              if cursor != total:
                  raise SystemExit(f"{backend}: covered {cursor}, expected {total}")
              manifest["backends"][backend] = {
                  "seeds": cursor,
                  "parts": [
                      {"seed": seed, "seeds": count, "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
                      for seed, count, report, path in parts
                  ],
              }
          Path("campaign-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload campaign manifest
        uses: actions/upload-artifact@v4
        with:
          name: trusted-p1-campaign-manifest
          path: campaign-manifest.json
          retention-days: 90
