name: Cross-repository conformance

on:
  workflow_dispatch:
    inputs:
      contract_ref:
        description: Contract Git ref
        required: true
        default: main
        type: string
      python_ref:
        description: vv-agent Git ref or commit
        required: true
        default: main
        type: string
      record_verified:
        description: Record the successful implementation revisions in support-matrix.json
        required: true
        default: false
        type: boolean
      preview:
        description: Test exact candidate commits with an unpublished contract bundle
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vv_agent
          POSTGRES_PASSWORD: vv_agent_test
          POSTGRES_DB: vv_agent_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U vv_agent -d vv_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_RUN_LIVE_TESTS: "0"
    steps:
      - name: Require exact candidate revisions for the preview
        if: inputs.preview == true
        shell: bash
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
          PYTHON_REF: ${{ inputs.python_ref }}
          RECORD_VERIFIED: ${{ inputs.record_verified }}
        run: |
          set -euo pipefail
          [[ "$CONTRACT_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PYTHON_REF" =~ ^[0-9a-f]{40}$ ]]
          test "$RECORD_VERIFIED" = false

      - name: Checkout contract
        uses: actions/checkout@v6
        with:
          path: contract
          ref: ${{ inputs.contract_ref || 'main' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Python implementation
        uses: actions/checkout@v6
        with:
          repository: AndersonBY/vv-agent
          path: vv-agent
          ref: ${{ inputs.python_ref || 'main' }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client ripgrep

      - name: Probe PostgreSQL service
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: vv_agent
          PGPASSWORD: vv_agent_test
          PGDATABASE: vv_agent_test
        run: test "$(psql -Atc 'SELECT 1')" = 1

      - name: Validate canonical contract
        run: |
          python3 contract/scripts/contractctl.py --root contract validate
          node contract/scripts/verify_jcs.mjs
          python3 -m unittest discover -s contract/tests
          python3 contract/scripts/contractctl.py --root contract build --output-dir contract/dist \
            --revision "$(git -C contract rev-parse HEAD)"

      - name: Verify Python locked snapshot for a published contract
        if: inputs.preview != true
        run: |
          python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent check --source contract
          python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent check --artifact "$(python3 -c 'import json; print(json.load(open("vv-agent/contract.lock.json"))["artifact_url"])')"

      - name: Verify exact preview archive and sync the generated snapshot
        if: inputs.preview == true
        shell: bash
        env:
          CONTRACT_REF: ${{ inputs.contract_ref }}
          PYTHON_REF: ${{ inputs.python_ref }}
        run: |
          set -euo pipefail
          test "$(git -C contract rev-parse HEAD)" = "$CONTRACT_REF"
          test "$(git -C vv-agent rev-parse HEAD)" = "$PYTHON_REF"
          python3 contract/scripts/contractctl.py --root contract build --output-dir contract/repeat --revision "$CONTRACT_REF"
          diff -r contract/dist contract/repeat
          archives=(contract/dist/vv-agent-contract-*.zip)
          test "${#archives[@]}" = 1
          metadata=${archives[0]%.zip}.release.json
          artifact_url=$(jq -er '.artifact_url' "$metadata")
          snapshot=(python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent)
          "${snapshot[@]}" sync --source contract --artifact "${archives[0]}" \
            --artifact-url "$artifact_url" --revision "$CONTRACT_REF"
          "${snapshot[@]}" check --source contract --artifact "${archives[0]}"
          unexpected=$(git -C vv-agent diff --name-only HEAD -- . ':!contract.lock.json' ':!tests/fixtures/parity')
          test -z "$unexpected"
          untracked=$(git -C vv-agent ls-files --others --exclude-standard -- . ':!tests/fixtures/parity')
          test -z "$untracked"
          sha256sum "${archives[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Python and historical reader dependencies
        working-directory: vv-agent
        run: |
          uv sync --locked --dev --extra s3
          uv venv --python 3.12 "$RUNNER_TEMP/vv-agent-0.36.0"
          uv pip install --python "$RUNNER_TEMP/vv-agent-0.36.0/bin/python" 'vv-agent[postgres]==0.36.0'
          printf 'VV_AGENT_0360_PYTHON=%s\n' "$RUNNER_TEMP/vv-agent-0.36.0/bin/python" >> "$GITHUB_ENV"

      - name: Run Python full tests
        working-directory: vv-agent
        env:
          VV_AGENT_TEST_POSTGRES_DSN: postgresql://vv_agent:vv_agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/vv_agent_test
          TMPDIR: /tmp
        run: uv run pytest -x -vv -o faulthandler_timeout=120 -k "not simulation_smoke"

      - name: Run Python static checks
        working-directory: vv-agent
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run ty check

      - name: Run Python seeded simulation smoke
        working-directory: vv-agent
        run: TMPDIR=/dev/shm timeout 60s uv run pytest tests/sim -k smoke -q -s

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Cross-repository conformance"
            echo
            echo "- Contract: \`$(git -C contract rev-parse HEAD)\`"
            echo "- Python: \`$(git -C vv-agent rev-parse HEAD)\`"
            echo "- Fixture manifest: \`$(sha256sum contract/fixtures/SHA256SUMS | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"
