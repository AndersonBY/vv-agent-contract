name: Cross-repository conformance

on:
  workflow_dispatch:
    inputs:
      contract_ref:
        description: Contract Git ref
        required: true
        default: main
        type: string
      python_ref:
        description: vv-agent Git ref or commit
        required: true
        default: main
        type: string
      record_verified:
        description: Record the successful implementation revisions in support-matrix.json
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8
        ports:
          - 6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vv_agent
          POSTGRES_PASSWORD: vv_agent_test
          POSTGRES_DB: vv_agent_test
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U vv_agent -d vv_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_RUN_LIVE_TESTS: "0"
    steps:
      - name: Checkout contract
        uses: actions/checkout@v6
        with:
          path: contract
          ref: ${{ inputs.contract_ref || 'main' }}
          fetch-depth: 0

      - name: Checkout Python implementation
        uses: actions/checkout@v6
        with:
          repository: AndersonBY/vv-agent
          path: vv-agent
          ref: ${{ inputs.python_ref || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y redis-tools postgresql-client ripgrep

      - name: Probe Redis service
        shell: bash
        env:
          REDIS_HOST_PORT: ${{ job.services.redis.ports['6379'] }}
        run: |
          set -euo pipefail
          test "$(redis-cli --raw -h 127.0.0.1 -p "$REDIS_HOST_PORT" ping)" = PONG

      - name: Probe PostgreSQL service
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: vv_agent
          PGPASSWORD: vv_agent_test
          PGDATABASE: vv_agent_test
        run: test "$(psql -Atc 'SELECT 1')" = 1

      - name: Validate canonical contract
        run: |
          python3 contract/scripts/contractctl.py --root contract validate
          node contract/scripts/verify_jcs.mjs
          python3 -m unittest discover -s contract/tests
          python3 contract/scripts/contractctl.py --root contract build --output-dir contract/dist

      - name: Verify Python locked snapshot
        run: |
          python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent check --source contract
          python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent check --artifact "$(python3 -c 'import json; print(json.load(open("vv-agent/contract.lock.json"))["artifact_url"])')"

      - name: Run Python full gate
        working-directory: vv-agent
        env:
          VV_AGENT_TEST_REDIS_URL: redis://127.0.0.1:${{ job.services.redis.ports['6379'] }}/15
          VV_AGENT_TEST_POSTGRES_DSN: postgresql://vv_agent:vv_agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/vv_agent_test
        run: |
          uv sync --dev --extra s3
          uv run pytest
          uv run ruff check .
          uv run ty check

      - name: Record evidence
        shell: bash
        run: |
          {
            echo "## Cross-repository conformance"
            echo
            echo "- Contract: \`$(git -C contract rev-parse HEAD)\`"
            echo "- Python: \`$(git -C vv-agent rev-parse HEAD)\`"
            echo "- Fixture manifest: \`$(sha256sum contract/fixtures/SHA256SUMS | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update verified support matrix
        if: inputs.record_verified == true
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.contract_ref }}" = "main"
          test "${{ inputs.python_ref }}" = "main"
          python_revision="$(git -C vv-agent rev-parse HEAD)"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 contract/scripts/record_adoption.py \
            --root contract \
            --python-revision "$python_revision" \
            --run-url "$run_url"
          python3 contract/scripts/contractctl.py --root contract validate
          python3 -m unittest discover -s contract/tests

      - name: Commit verified support matrix
        if: inputs.record_verified == true
        shell: bash
        run: |
          set -euo pipefail
          if git -C contract diff --quiet -- support-matrix.json; then
            echo "Support matrix already records these revisions"
            exit 0
          fi
          git -C contract config user.name "github-actions[bot]"
          git -C contract config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C contract add support-matrix.json
          git -C contract commit -m "chore: record verified contract adoption"
          git -C contract push origin HEAD:main
