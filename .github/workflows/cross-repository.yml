name: Cross-repository conformance

on:
  workflow_dispatch:
    inputs:
      contract_ref:
        description: Contract Git ref
        required: true
        default: main
        type: string
      python_ref:
        description: vv-agent Git ref or commit
        required: true
        default: main
        type: string
      record_verified:
        description: Record the successful implementation revisions in support-matrix.json
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "23 3 * * 1"

concurrency:
  group: cross-repository-conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vv_agent
          POSTGRES_PASSWORD: vv_agent_test
          POSTGRES_DB: vv_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vv_agent -d vv_agent_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      UV_NO_SOURCES: "1"
      VV_AGENT_RUN_LIVE_TESTS: "0"
      PYTEST_SHARDS: "4"
      PYTHONPATH: ${{ github.workspace }}/vv-agent
    steps:
      - name: Checkout contract
        uses: actions/checkout@v6
        with:
          path: contract
          ref: ${{ inputs.contract_ref || (github.event_name == 'schedule' && 'v39.0.0' || 'main') }}
          fetch-depth: 0

      - name: Checkout Python implementation
        uses: actions/checkout@v6
        with:
          repository: AndersonBY/vv-agent
          path: vv-agent
          ref: ${{ inputs.python_ref || (github.event_name == 'schedule' && '54a437d1298ddcf400d7ec83f72bf508385ff9aa' || 'main') }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: vv-agent/uv.lock

      - name: Install native test tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client ripgrep

      - name: Probe PostgreSQL service
        shell: bash
        env:
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: vv_agent
          PGPASSWORD: vv_agent_test
          PGDATABASE: vv_agent_test
        run: test "$(psql -Atc 'SELECT 1')" = 1

      - name: Validate canonical contract
        run: |
          python3 contract/scripts/contractctl.py --root contract validate
          node contract/scripts/verify_jcs.mjs
          python3 -m unittest discover -s contract/tests
          python3 contract/scripts/contractctl.py --root contract build --output-dir contract/dist

      - name: Verify Python locked snapshot
        run: |
          python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent check --source contract
          python3 vv-agent/scripts/contract_snapshot.py --repo-root vv-agent check --artifact "$(python3 -c 'import json; print(json.load(open("vv-agent/contract.lock.json"))["artifact_url"])')"

      - name: Install Python gate dependencies
        working-directory: vv-agent
        env:
          VV_AGENT_TEST_POSTGRES_DSN: postgresql://vv_agent:vv_agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/vv_agent_test
          TMPDIR: /tmp
        run: |
          uv sync --locked --dev --extra s3

      - name: Install historical compatibility reader
        working-directory: vv-agent
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/vv-agent-0.33.3"
          uv pip install --python "$RUNNER_TEMP/vv-agent-0.33.3/bin/python" 'vv-agent[postgres]==0.33.3'
          echo "VV_AGENT_0333_PYTHON=$RUNNER_TEMP/vv-agent-0.33.3/bin/python" >> "$GITHUB_ENV"

      - name: Verify repository contract boundaries
        working-directory: vv-agent
        run: python3 scripts/check_repository_contracts.py

      - name: Verify formatting
        working-directory: vv-agent
        run: uv run ruff format --check .

      - name: Run Python tests in parallel shards
        working-directory: vv-agent
        env:
          VV_AGENT_TEST_POSTGRES_DSN: postgresql://vv_agent:vv_agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/vv_agent_test
          TMPDIR: /tmp
        shell: bash
        run: |
          set -euo pipefail
          collect_output="$RUNNER_TEMP/pytest-collect.txt"
          uv run pytest --collect-only -q -k "not simulation_smoke" > "$collect_output"
          for ((shard = 0; shard < PYTEST_SHARDS; shard += 1)); do
            : > "$RUNNER_TEMP/pytest-shard-$shard.files"
          done
          while IFS=$'\t' read -r shard path; do
            printf '%s\n' "$path" >> "$RUNNER_TEMP/pytest-shard-$shard.files"
          done < <(
            python3 - "$collect_output" "$PYTEST_SHARDS" <<'PY'
          from collections import Counter
          from pathlib import Path
          import sys

          collect_output = Path(sys.argv[1]).read_text()
          shard_count = int(sys.argv[2])
          test_counts = Counter(
              line.split("::", 1)[0]
              for line in collect_output.splitlines()
              if line.startswith("tests/") and "::" in line
          )
          if not test_counts:
              raise SystemExit("pytest collection produced no test nodes")

          loads = [0] * shard_count
          assignments = [[] for _ in range(shard_count)]
          for path, count in sorted(test_counts.items(), key=lambda item: (-item[1], item[0])):
              shard = min(range(shard_count), key=loads.__getitem__)
              assignments[shard].append(path)
              loads[shard] += count

          for shard, paths in enumerate(assignments):
              if not paths:
                  raise SystemExit(f"pytest shard {shard} received no files")
              print(f"shard {shard}: {loads[shard]} collected tests across {len(paths)} files", file=sys.stderr)
              for path in paths:
                  print(f"{shard}\t{path}")
          PY
          )

          declare -a pids=()
          for ((shard = 0; shard < PYTEST_SHARDS; shard += 1)); do
            (
              set -o pipefail
              mapfile -t shard_files < "$RUNNER_TEMP/pytest-shard-$shard.files"
              test "${#shard_files[@]}" -gt 0
              printf '[pytest-shard-%s] files=%s\n' "$shard" "${#shard_files[@]}"
              uv run pytest -x -vv -k "not simulation_smoke" -o faulthandler_timeout=120 "${shard_files[@]}" 2>&1 \
                | sed -u "s/^/[pytest-shard-$shard] /" \
                | tee "$RUNNER_TEMP/pytest-shard-$shard.log"
            ) &
            pids+=("$!")
          done

          status=0
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              status=1
            fi
          done
          exit "$status"

      - name: Run seeded simulation smoke
        working-directory: vv-agent
        env:
          TMPDIR: /dev/shm
        run: timeout 60s uv run pytest tests/sim -k smoke -q -s

      - name: Run Python static checks
        working-directory: vv-agent
        run: |
          uv run ruff check .
          uv run ty check --extra-search-path tests

      - name: Verify isolated install matrix
        working-directory: vv-agent
        env:
          VV_AGENT_TEST_POSTGRES_DSN: postgresql://vv_agent:vv_agent_test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/vv_agent_test
        run: uv run --no-project python scripts/install_matrix.py

      - name: Record evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Cross-repository conformance"
            echo
            echo "- Contract: \`$(git -C contract rev-parse HEAD)\`"
            echo "- Python: \`$(git -C vv-agent rev-parse HEAD)\`"
            echo "- Fixture manifest: \`$(sha256sum contract/fixtures/SHA256SUMS | cut -d' ' -f1)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update verified support matrix
        if: inputs.record_verified == true
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.contract_ref }}" = "main"
          test "${{ inputs.python_ref }}" = "main"
          python_revision="$(git -C vv-agent rev-parse HEAD)"
          run_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python3 contract/scripts/record_adoption.py \
            --root contract \
            --python-revision "$python_revision" \
            --run-url "$run_url"
          python3 contract/scripts/contractctl.py --root contract validate
          python3 -m unittest discover -s contract/tests

      - name: Commit verified support matrix
        if: inputs.record_verified == true
        shell: bash
        run: |
          set -euo pipefail
          if git -C contract diff --quiet -- support-matrix.json; then
            echo "Support matrix already records these revisions"
            exit 0
          fi
          git -C contract config user.name "github-actions[bot]"
          git -C contract config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C contract add support-matrix.json
          git -C contract commit -m "chore: record verified contract adoption"
          git -C contract push origin HEAD:main
